name: Deploy Backend to VPS

on:
  push:
    branches: [main]
    paths:
      - "Server/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 187.127.224.73
          username: deploy
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            source ~/.nvm/nvm.sh
            cd /opt/app
            git pull origin main
            cd Server
            npm install --include=dev
            npm run build
            pm2 restart insurance-api
